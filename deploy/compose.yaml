# Internal services (db, migrate, backup) publish no ports: only the web app is reachable, and only through the owner's proxy.
services:
  web:
    build: .
    image: zero-web
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://zero:${POSTGRES_PASSWORD}@db:5432/zero
      APP_URL: https://zero.example.com
    # The owner's proxy forwards https://zero.example.com to 127.0.0.1:20080.
    ports:
      - "127.0.0.1:20080:3000"
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zero
      POSTGRES_DB: zero
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?missing - deploy.sh creates it in .env on the first run}"
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "effective_cache_size=192MB", "-c", "work_mem=4MB", "-c", "max_connections=30", "-c", "timezone=UTC"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 320m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zero -d zero"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # One-shot: applies new files from db/migrations, then exits.
  migrate:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: zero
      PGDATABASE: zero
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./db/migrations:/migrations:ro
      - ./db/migrate.sh:/migrate.sh:ro
    command: ["sh", "/migrate.sh"]
    mem_limit: 64m

  # A compressed dump every 24 hours into ~/app/backups on the server, kept for 14 days.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGUSER: zero
      PGDATABASE: zero
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./db/backup.sh:/backup.sh:ro
    command: ["sh", "/backup.sh"]
    mem_limit: 64m

volumes:
  pgdata:
